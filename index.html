function photoFor(p){return productPhotos[p.name+'|'+p.weight] || null;}
function makePhoto(p){const file=photoFor(p);if(!file){const placeholder=document.createElement('div');placeholder.className='photo-placeholder';placeholder.textContent='Фото пока нет';return placeholder;}const b=document.createElement('button');b.className='photo-open';b.type='button';b.title='Увеличить фотографию';const im=document.createElement('img');im.className='product-photo';im.src=file;im.alt='Этикетка корма '+p.name;im.loading='lazy';const caption=document.createElement('div');caption.className='note';caption.textContent='Этикетка корма. Фасовка указана в карточке.';b.append(im,caption);b.addEventListener('click',()=>{const d=document.createElement('dialog');d.className='photo-dialog';const close=document.createElement('button');close.textContent='Закрыть ✕';close.addEventListener('click',()=>d.close());const big=document.createElement('img');big.src=file;big.alt=im.alt;d.append(close,big);document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()});return b;}
function renderCart(){cartPanel.replaceChildren();const title=document.createElement('h2');title.textContent='Корзина покупателя ('+cart.size+')';cartPanel.append(title);if(!cart.size){const empty=document.createElement('p');empty.className='cart-empty';empty.textContent='Добавьте товары из каталога — здесь появится общий заказ.';cartPanel.append(empty);return;}let total=0;for(const [p,qty] of cart){const subtotal=p.price*qty;total+=subtotal;const row=document.createElement('div');row.className='cart-item';const info=document.createElement('div');const name=document.createElement('div');name.className='cart-item-name';name.textContent=p.name;const detail=document.createElement('div');detail.className='cart-item-detail';detail.textContent=p.weight+' кг · '+qty+' × '+money(p.price)+' = '+money(subtotal);info.append(name,detail);const controls=document.createElement('div');controls.className='cart-controls';const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label','Уменьшить количество: '+p.name);minus.addEventListener('click',()=>setCartQuantity(p,qty-1));const number=document.createElement('span');number.textContent=String(qty);const plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label','Увеличить количество: '+p.name);plus.disabled=Number.isInteger(p.stock)&&qty>=p.stock;plus.addEventListener('click',()=>setCartQuantity(p,qty+1));const remove=document.createElement('button');remove.type='button';remove.className='cart-remove';remove.textContent='Убрать';remove.addEventListener('click',()=>setCartQuantity(p,0));controls.append(minus,number,plus,remove);row.append(info,controls);cartPanel.append(row);}const summary=document.createElement('div');summary.className='cart-total';summary.textContent='Итого: '+money(total);const order=document.createElement('a');order.className='btn';order.href='https://t.me/ianafrolova?text='+encodeURIComponent('Здравствуйте! Хочу оформить заказ:\\n'+[...cart].map(([p,qty],i)=>(i+1)+'. '+p.name+' — '+p.weight+' кг, '+qty+' шт. × '+money(p.price)+' = '+money(p.price*qty)).join('\\n')+'\\nИтого: '+money(total)+'\\nПодскажите, пожалуйста, наличие и условия доставки.');order.target='_blank';order.rel='noopener noreferrer';order.textContent='Оформить заказ в Telegram';cartPanel.append(summary,order);}
function setCartQuantity(p,qty){if(qty<=0){cart.delete(p);}else{cart.set(p,Number.isInteger(p.stock)?Math.min(qty,p.stock):qty);}render();}
function render(){const term=search.value.toLocaleLowerCase('ru').trim();const visible=products.filter(p=>(!term||p.name.toLocaleLowerCase('ru').includes(term))&&(!category.value||p.cat===category.value)&&(!weight.value||String(p.weight)===weight.value));count.textContent='Найдено товаров: '+visible.length;grid.replaceChildren();for(const p of visible){const card=document.createElement('article');card.className='card';const c=document.createElement('div');c.className='category';c.textContent=p.cat;const n=document.createElement('div');n.className='name';n.textContent=p.name;const w=document.createElement('div');w.className='weight';w.textContent='Фасовка: '+p.weight+' кг';const price=document.createElement('div');price.className='price';price.textContent=money(p.price);let availability=null;if(Number.isInteger(p.stock)){availability=document.createElement('div');availability.className='stock';const lastTwo=p.stock%100,lastOne=p.stock%10;const unit=lastTwo>=11&&lastTwo<=14?'мешков':lastOne===1?'мешок':lastOne>=2&&lastOne<=4?'мешка':'мешков';availability.textContent='В наличии: '+p.stock+' '+unit+' по '+p.weight+' кг';}const add=document.createElement('button');add.type='button';add.className='cart-add';const qty=cart.get(p)||0;const maxed=Number.isInteger(p.stock)&&qty>=p.stock;add.textContent=maxed?'В наличии уже '+p.stock+' шт.':qty?'В корзине: '+qty+' · добавить ещё':'Добавить в корзину';add.disabled=maxed;add.addEventListener('click',()=>setCartQuantity(p,qty+1));const a=document.createElement('a');a.className='btn';const message='Здравствуйте! Хочу заказать:\\n'+p.name+'\\nФасовка: '+p.weight+' кг\\nЦена за упаковку: '+money(p.price)+'\\nПодскажите, пожалуйста, наличие и условия доставки.';a.href='https://t.me/ianafrolova?text='+encodeURIComponent(message);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Заказать только этот товар';const photo=makePhoto(p);card.append(c);if(photo)card.append(photo);card.append(n,w,price);if(availability)card.append(availability);card.append(add,a);grid.append(card);}renderCart();}
search.addEventListener('input',render);category.addEventListener('change',render);weight.addEventListener('change',render);render();
